[project]
name = "smc-validator"
version = "0.1.0"
description = "Phase 1: statistical validation of an SMC (Smart Money Concepts) trading strategy before any Pine Script work begins."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "plotly>=5.22",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "backtrader>=1.9.78.123",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smc_validator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
