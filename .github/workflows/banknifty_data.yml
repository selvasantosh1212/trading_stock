name: Bank Nifty Intraday Data

# Yahoo's free chart API only exposes a limited lookback window per
# interval (1m: 7d, 5m/15m: 60d, 1h: ~2y) — see
# smc_validator/data_ingestion/banknifty_intraday.py. Running this daily
# and merging each fetch into the saved parquet history is what lets
# 1m/5m/15m accumulate past that window over time instead of losing bars
# once they age out of Yahoo's range. Scheduled shortly after NSE close
# (15:30 IST = 10:00 UTC); cron is UTC-only and doesn't know Indian market
# holidays, so it'll also fire harmlessly on days NSE is shut.
on:
  schedule:
    - cron: "5 10 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: banknifty-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Update Bank Nifty intraday data
        run: python -m scripts.update_banknifty_data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/banknifty_1m.parquet data/processed/banknifty_5m.parquet data/processed/banknifty_15m.parquet data/processed/banknifty_1h.parquet
          git diff --cached --quiet || git commit -m "Daily Bank Nifty data update [skip ci]"
          git push

      # The 1m history has only a 7-day lookback window on Yahoo's side, so
      # a failure that goes unnoticed for a week means that stretch of 1m
      # data is gone for good and can never be backfilled. Opens (or
      # comments on) a tracking issue instead of relying on email
      # notification settings nobody's confirmed are on.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --search "Bank Nifty data capture is failing in:title" --state open --json number --jq '.[0].number')
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Failed again on $(date -u +%Y-%m-%d). Run: $run_url"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Bank Nifty data capture is failing" \
              --body "The daily Bank Nifty capture workflow failed on $(date -u +%Y-%m-%d). Run: $run_url

              Fix promptly — the 1m timeframe only has a 7-day lookback window on Yahoo's side, so a gap longer than that is unrecoverable."
          fi
