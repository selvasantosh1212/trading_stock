name: Stock HH/LL Screener

# Runs once a day, shortly after NSE close (15:30 IST = 10:00 UTC). Cron is
# UTC-only and doesn't know about Indian market holidays, so it'll also fire
# (harmlessly — Yahoo just returns the same last-close data) on days NSE is
# shut. workflow_dispatch is included so a run can be triggered manually to
# test without waiting for the schedule.
on:
  schedule:
    - cron: "5 10 * * 1-5"
  workflow_dispatch: {}

# Prevents two runs (e.g. the scheduled cron and a manual "Add a stock"
# dispatch) from racing each other's final `git push` — queue instead of
# running concurrently, since both write to the same tracked state files.
concurrency:
  group: stock-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run screener
        run: python -m scripts.run_stock_screener

      # stock_hh_ll_tool/state/positions.json tracks the Weekly/Daily
      # entry/exit strategy's open positions across days. GitHub Actions
      # runners are ephemeral (fresh checkout every run), so without
      # committing this file back, position tracking would reset to FLAT
      # every single day instead of persisting across weeks like it does
      # when run locally. docs/data.json is the dashboard's data source
      # (docs/index.html, served over GitHub Pages) and needs committing
      # every run so the page reflects the latest screen, even on days
      # nothing changed in positions.json.
      - name: Commit updated state and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_hh_ll_tool/state/positions.json docs/data.json
          git diff --cached --quiet || git commit -m "Daily screener run: update dashboard data [skip ci]"
          git push
